<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>스칼프잇 채용 지원 DB</title>
<link rel="icon" href="/scalpit-logo.png">
<link rel="stylesheet" href="/academy/fonts/pretendard.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --bg:#0b0909;--bg2:#110c0d;--card:#161011;--card2:#1d1517;--line:#2b2223;--line2:#3a2e30;
  --ink:#f6f0e8;--mut:#c0b5ac;--faint:#8f847b;
  --rose:#f0657a;--red:#d1283f;--deep:#960f1c;
  --good:#58d3a0;--warn:#e8b653;--info:#8fb4ff;--bad:#f08a8a;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  --serif:"Cormorant Garamond",Georgia,serif;
  --mono:"IBM Plex Mono","Pretendard Variable",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--font);word-break:keep-all;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose);outline-offset:2px}
.mono{font-family:var(--mono)}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(90% 70% at 80% 0%,#4a0f1b 0%,var(--bg) 60%)}
.login form{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:30px 28px;display:grid;gap:14px;box-shadow:0 30px 70px #000a}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font:600 1.5rem/1 var(--serif)}
.brand span{font:600 .64rem var(--mono);letter-spacing:.3em;color:var(--mut)}
.login h1{font-size:1.1rem;margin:0}
.login label{display:grid;gap:6px;font-size:.8rem;font-weight:700;color:var(--mut)}
input,select,textarea{background:#0f0b0c;border:1px solid var(--line2);border-radius:9px;padding:9px 12px;min-height:40px;color:var(--ink)}
input::placeholder,textarea::placeholder{color:var(--faint)}
.btn{background:var(--red);border:0;color:#fff;font-weight:800;padding:0 18px;min-height:40px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn:hover{background:#e3364d}
.btn.ghost{background:transparent;border:1px solid var(--line2);color:var(--ink);font-weight:600}
.btn.ghost:hover{background:#ffffff0d}
.btn.sm{min-height:32px;padding:0 12px;font-size:.82rem;border-radius:8px}
.err{color:var(--bad);min-height:1.2em;margin:0;font-size:.86rem}

/* top */
.top{position:sticky;top:0;z-index:30;background:#0b0909e8;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:1360px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap}
.live{display:inline-flex;align-items:center;gap:8px;font:500 .74rem var(--mono);color:var(--mut)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 #58d3a066;animation:pulse 2s infinite}
.live.off i{background:var(--faint);animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 #58d3a066}70%{box-shadow:0 0 0 8px #58d3a000}100%{box-shadow:0 0 0 0 #58d3a000}}
.grow{flex:1}
.who{font-size:.8rem;color:var(--mut)}.who b{color:var(--ink)}

main{max-width:1360px;margin:0 auto;padding:22px 20px 80px}

/* KPI */
.kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:18px}
@media(max-width:720px){.kpi{grid-template-columns:repeat(3,1fr)}}
.kpi .k{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi .k .v{font:800 1.6rem/1 var(--serif);letter-spacing:-.01em}
.kpi .k .l{margin-top:6px;font:600 .72rem var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.kpi .k.hot .v{color:var(--rose)}

/* filters */
.flt{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:7px 14px;font:600 .82rem var(--font);cursor:pointer}
.chip[aria-pressed=true]{background:var(--rose);color:#1a0a0d;border-color:var(--rose)}
.chip .n{margin-left:6px;font:600 .72rem var(--mono);opacity:.75}
.search{flex:1;min-width:200px;display:flex;gap:8px}
.search input{flex:1}

/* table */
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
table{width:100%;border-collapse:collapse}
th,td{padding:12px 14px;text-align:left;font-size:.9rem;vertical-align:top;border-bottom:1px solid var(--line)}
th{background:#120d0e;color:var(--mut);font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;position:sticky;top:0}
tr:hover td{background:#1a1314}
td.id{font:600 .76rem var(--mono);color:var(--faint)}
td.at{font:500 .76rem var(--mono);color:var(--mut);white-space:nowrap}
td.name{font-weight:700}
td.phone a{color:var(--info);text-decoration:none}
.b-chips{display:flex;flex-wrap:wrap;gap:4px}
.b-chip{font:600 .72rem var(--mono);background:#2a1a1d;color:var(--rose);padding:2px 8px;border-radius:999px}
.b-chip.any{background:#1a2a1d;color:var(--good)}
.c-txt{font-weight:600;color:var(--ink)}
.c-sub{display:block;font-size:.78rem;color:var(--faint);margin-top:2px}
select.st{background:#0f0b0c;border:1px solid var(--line2);border-radius:8px;padding:5px 8px;min-height:32px;font-weight:700;font-size:.8rem}
select.st.new{color:var(--rose)}
select.st.contacted{color:var(--info)}
select.st.interview{color:var(--warn)}
select.st.hired{color:var(--good)}
select.st.rejected,select.st.cancelled{color:var(--faint)}
textarea.note{width:100%;min-height:40px;max-height:120px;background:#0f0b0c;border:1px solid var(--line2);border-radius:8px;padding:6px 10px;font-size:.84rem;resize:vertical}
.dup-tag{display:inline-block;margin-left:6px;font:700 .68rem var(--mono);background:#2a1a1d;color:var(--rose);padding:1px 7px;border-radius:999px}
.dl-btn{display:inline-flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 10px;background:#2a1a1d;border:1px solid var(--line2);border-radius:6px;color:var(--rose);font-size:.78rem;font-weight:600;text-decoration:none;transition:background .15s,border-color .15s}
.dl-btn:hover{background:#3a2228;border-color:var(--rose)}
.dl-btn small{font-weight:400;font-size:.68rem;color:var(--faint);letter-spacing:.02em}

.empty{padding:60px 20px;text-align:center;color:var(--faint)}
.err-top{background:#2a0a0f;color:var(--bad);padding:10px 20px;text-align:center;font-size:.85rem}

@media(max-width:720px){
  table thead{display:none}
  table tr{display:block;border-bottom:1px solid var(--line);padding:14px}
  table td{display:block;border:0;padding:4px 0}
  td.id::before{content:"ID "}
  td.at::before{content:""}
  td.name{font-size:1.05rem}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section class="login" id="login">
  <form id="loginForm">
    <div class="brand"><b>Scálpit</b><span>JOIN · ADMIN</span></div>
    <h1>채용 지원 DB</h1>
    <label>관리자 이름 <input id="who" required placeholder="예: 사장님" maxlength="20"></label>
    <label>비밀번호 <input id="pw" type="password" required></label>
    <p class="err" id="loginErr"></p>
    <button class="btn" type="submit">로그인</button>
  </form>
</section>

<!-- APP -->
<div id="app" hidden>
  <header class="top">
    <div class="top-in">
      <div class="brand"><b>Scálpit</b><span>JOIN · ADMIN</span></div>
      <span class="live" id="live"><i></i><span id="liveT">실시간</span></span>
      <div class="grow"></div>
      <span class="who" id="whoLbl"></span>
      <button class="btn ghost sm" id="refresh">새로고침</button>
      <button class="btn ghost sm" id="logout">로그아웃</button>
    </div>
    <div id="errTop" class="err-top" hidden></div>
  </header>

  <main>
    <div class="kpi">
      <div class="k"><div class="v" id="kTotal">—</div><div class="l">전체 지원</div></div>
      <div class="k hot"><div class="v" id="kNew">—</div><div class="l">신규</div></div>
      <div class="k"><div class="v" id="kContact">—</div><div class="l">연락함</div></div>
      <div class="k"><div class="v" id="kItv">—</div><div class="l">면접</div></div>
      <div class="k"><div class="v" id="kHired">—</div><div class="l">합격</div></div>
      <div class="k"><div class="v" id="kToday">—</div><div class="l">오늘 유입</div></div>
    </div>

    <div class="flt">
      <button class="chip" data-f="all" aria-pressed="true">전체<span class="n" id="cAll">0</span></button>
      <button class="chip" data-f="new" aria-pressed="false">신규<span class="n" id="cNew">0</span></button>
      <button class="chip" data-f="contacted" aria-pressed="false">연락함<span class="n" id="cContact">0</span></button>
      <button class="chip" data-f="interview" aria-pressed="false">면접<span class="n" id="cItv">0</span></button>
      <button class="chip" data-f="hired" aria-pressed="false">합격<span class="n" id="cHired">0</span></button>
      <button class="chip" data-f="rejected" aria-pressed="false">불합격<span class="n" id="cRej">0</span></button>
      <button class="chip" data-f="cancelled" aria-pressed="false">취소<span class="n" id="cCan">0</span></button>
      <div class="search">
        <input id="q" placeholder="이름 · 번호 · 지점 검색">
      </div>
    </div>

    <div class="panel">
      <table>
        <thead>
          <tr>
            <th style="width:60px">ID</th>
            <th style="width:120px">접수</th>
            <th style="width:140px">이름 · 연락처</th>
            <th>희망지점</th>
            <th>경력</th>
            <th>관련 경력</th>
            <th style="width:110px">이력서</th>
            <th style="width:120px">상태</th>
            <th style="width:220px">메모</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty" hidden>지원 내역이 없습니다.</div>
    </div>
  </main>
</div>

<script>
(function(){
  var LS = {
    get: function(k){ try{return localStorage.getItem(k)}catch(e){return null} },
    set: function(k,v){ try{localStorage.setItem(k,v)}catch(e){} },
    rm:  function(k){ try{localStorage.removeItem(k)}catch(e){} },
  };
  var ST = ['new','contacted','interview','hired','rejected','cancelled'];
  var ST_LABEL = {new:'신규', contacted:'연락함', interview:'면접', hired:'합격', rejected:'불합격', cancelled:'취소'};
  var BRANCH_LABEL = {dongtan:'동탄', cheonan:'천안', gwanggyo:'광교', apgujeong:'압구정', any:'어디든'};
  var CAREER_LABEL = {none:'신입', under1:'1년 미만', '1to3':'1~3년', over3:'3년 이상', under3:'3년 미만'};
  var state = { all:[], filter:'all', q:'', pw:'', who:'' };

  // login
  var saved = LS.get('join.auth');
  if(saved){
    var p = JSON.parse(saved);
    state.pw = p.pw; state.who = p.who;
    tryLogin();
  }

  document.getElementById('loginForm').addEventListener('submit', function(e){
    e.preventDefault();
    state.who = document.getElementById('who').value.trim() || '관리자';
    state.pw = document.getElementById('pw').value;
    document.getElementById('loginErr').textContent = '';
    tryLogin(true);
  });

  function tryLogin(save){
    fetch('/api/join/applications', {headers: authHeaders()}).then(function(r){
      if(r.ok){
        if(save) LS.set('join.auth', JSON.stringify({pw:state.pw, who:state.who}));
        document.getElementById('login').hidden = true;
        document.getElementById('app').hidden = false;
        document.getElementById('whoLbl').innerHTML = '<b>'+esc(state.who)+'</b>';
        return r.json().then(apply);
      } else {
        document.getElementById('loginErr').textContent = '비밀번호가 올바르지 않습니다.';
        LS.rm('join.auth');
      }
    }).catch(function(){
      document.getElementById('loginErr').textContent = '서버에 연결할 수 없습니다.';
    });
  }

  function authHeaders(){
    return {'x-admin-password': state.pw, 'x-admin-name': encodeURIComponent(state.who)};
  }

  // poll
  setInterval(function(){
    if(document.getElementById('app').hidden) return;
    load();
  }, 15000);

  document.getElementById('refresh').addEventListener('click', load);
  document.getElementById('logout').addEventListener('click', function(){
    LS.rm('join.auth');
    location.reload();
  });

  // filters
  document.querySelectorAll('.chip').forEach(function(b){
    b.addEventListener('click', function(){
      document.querySelectorAll('.chip').forEach(function(x){x.setAttribute('aria-pressed','false')});
      b.setAttribute('aria-pressed','true');
      state.filter = b.dataset.f;
      render();
    });
  });
  document.getElementById('q').addEventListener('input', function(e){
    state.q = e.target.value.trim().toLowerCase();
    render();
  });

  function load(){
    fetch('/api/join/applications', {headers: authHeaders()}).then(function(r){return r.json()}).then(apply).catch(function(){
      document.getElementById('live').classList.add('off');
      document.getElementById('errTop').hidden = false;
      document.getElementById('errTop').textContent = '서버 연결이 불안정합니다. 자동 재시도 중…';
    });
  }

  function apply(d){
    if(!d.success){
      document.getElementById('errTop').hidden = false;
      document.getElementById('errTop').textContent = d.message || '데이터를 불러올 수 없습니다.';
      return;
    }
    document.getElementById('errTop').hidden = true;
    document.getElementById('live').classList.remove('off');
    state.all = d.data || [];
    render();
  }

  function render(){
    var all = state.all;
    var today = new Date(); today.setHours(0,0,0,0);
    var counts = {all: all.length, new:0, contacted:0, interview:0, hired:0, rejected:0, cancelled:0, today:0};
    all.forEach(function(a){
      counts[a.status] = (counts[a.status]||0) + 1;
      if(new Date(a.createdAt) >= today) counts.today++;
    });
    setT('kTotal', counts.all);
    setT('kNew', counts.new);
    setT('kContact', counts.contacted);
    setT('kItv', counts.interview);
    setT('kHired', counts.hired);
    setT('kToday', counts.today);
    setT('cAll', counts.all);
    setT('cNew', counts.new);
    setT('cContact', counts.contacted);
    setT('cItv', counts.interview);
    setT('cHired', counts.hired);
    setT('cRej', counts.rejected);
    setT('cCan', counts.cancelled);

    var list = all;
    if(state.filter !== 'all') list = list.filter(function(a){return a.status === state.filter});
    if(state.q){
      var q = state.q;
      list = list.filter(function(a){
        var hay = (a.name+' '+a.phone+' '+(a.branches||[]).join(' ')+' '+(a.field||'')).toLowerCase();
        return hay.indexOf(q) >= 0;
      });
    }

    var rows = document.getElementById('rows');
    rows.innerHTML = list.map(rowHtml).join('');
    document.getElementById('empty').hidden = list.length > 0;

    rows.querySelectorAll('select.st').forEach(function(sel){
      sel.addEventListener('change', function(){
        patch(sel.dataset.id, {status: sel.value});
      });
    });
    rows.querySelectorAll('textarea.note').forEach(function(ta){
      var t;
      ta.addEventListener('input', function(){
        clearTimeout(t);
        t = setTimeout(function(){ patch(ta.dataset.id, {note: ta.value}); }, 700);
      });
    });
  }

  function rowHtml(a){
    var dt = new Date(a.createdAt);
    var mo = (dt.getMonth()+1).toString().padStart(2,'0');
    var dd = dt.getDate().toString().padStart(2,'0');
    var hh = dt.getHours().toString().padStart(2,'0');
    var mm = dt.getMinutes().toString().padStart(2,'0');
    var at = mo+'/'+dd+' '+hh+':'+mm;
    var phone = a.phone.replace(/^(\d{3})(\d{3,4})(\d{4})$/,'$1-$2-$3');
    var brs = (a.branches||[]).map(function(b){
      var isAny = b === 'any';
      return '<span class="b-chip'+(isAny?' any':'')+'">'+esc(BRANCH_LABEL[b]||b)+'</span>';
    }).join('');
    var opts = ST.map(function(s){return '<option value="'+s+'"'+(s===a.status?' selected':'')+'>'+ST_LABEL[s]+'</option>'}).join('');
    var career = CAREER_LABEL[a.career]||a.career||'—';
    var resumeCell = '<span style="color:var(--faint)">—</span>';
    if(a.resumeFilename){
      var sizeKb = a.resumeSize ? Math.round(a.resumeSize/1024) + 'KB' : '';
      var origName = esc(a.resumeOriginal || a.resumeFilename);
      resumeCell = '<a href="/api/join/applications/'+a.id+'/resume?p='+encodeURIComponent(state.pw)+'&w='+encodeURIComponent(state.who)+'" class="dl-btn" download title="'+origName+'">⬇ 다운로드<small>'+sizeKb+'</small></a>';
    }
    return (
      '<tr>'+
        '<td class="id">#'+a.id+(a.dup?'<span class="dup-tag">중복</span>':'')+'</td>'+
        '<td class="at">'+at+'</td>'+
        '<td class="name">'+esc(a.name)+'<span class="c-sub phone"><a href="tel:'+phone+'">'+phone+'</a></span></td>'+
        '<td><div class="b-chips">'+brs+'</div></td>'+
        '<td class="c-txt">'+esc(career)+'</td>'+
        '<td>'+(a.field?esc(a.field):'<span style="color:var(--faint)">—</span>')+'</td>'+
        '<td>'+resumeCell+'</td>'+
        '<td><select class="st '+a.status+'" data-id="'+a.id+'">'+opts+'</select></td>'+
        '<td><textarea class="note" data-id="'+a.id+'" placeholder="메모">'+esc(a.note||'')+'</textarea></td>'+
      '</tr>'
    );
  }

  function patch(id, body){
    fetch('/api/join/applications/'+id, {
      method:'PATCH',
      headers: Object.assign({'Content-Type':'application/json'}, authHeaders()),
      body: JSON.stringify(body)
    }).then(function(r){return r.json()}).then(function(d){
      if(d.success && d.application){
        var i = state.all.findIndex(function(x){return x.id === d.application.id});
        if(i>=0) state.all[i] = d.application;
        render();
      }
    });
  }

  function setT(id,v){ document.getElementById(id).textContent = v; }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]}); }
})();
</script>

</body>
</html>
