<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#3A1018" />
  <meta name="color-scheme" content="light" />
  <title>Scálpit | 사전 상담 설문지</title>
  <meta name="description" content="스칼프잇 헤드스파 & 두피케어 방문 전 사전 상담 설문지입니다. 약 3분이면 작성할 수 있어요." />
  <meta property="og:title" content="Scálpit | 사전 상담 설문지" />
  <meta property="og:description" content="방문 전 3분, 나에게 맞는 두피 케어를 위한 사전 설문을 작성해주세요." />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://scalpitform.com/" />
  <meta property="og:image" content="https://scalpitform.com/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --burg: #7B1A2B;
      --burg-deep: #3A1018;
      --burg-ink: #5A1020;
      --burg-tint: #FBF3F2;
      --burg-line: #E8C9CC;
      --cream: #FAF6F1;
      --cream-2: #F3EBE2;
      --card: #FFFFFF;
      --gold: #B08D62;
      --gold-soft: #D9C3A2;
      --ink: #1E1214;
      --text: #3A2A2B;
      --muted: #7D6C6B;
      --faint: #A99B98;
      --line: #EBE1D8;
      --line-strong: #DCCDC1;
      --danger: #B4232F;
      --radius: 14px;
      --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(58,16,24,.04), 0 4px 16px rgba(58,16,24,.04);
      --ease: cubic-bezier(.2,.7,.2,1);
      --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      --serif: 'Cormorant Garamond', 'Times New Roman', serif;
      --bar-h: 84px;
    }
    html[lang="ja"] { --sans: 'Pretendard Variable', 'Noto Sans JP', 'Hiragino Sans', sans-serif; }
    html[lang="zh"] { --sans: 'Pretendard Variable', 'Noto Sans SC', 'PingFang SC', sans-serif; }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans);
      background: var(--cream);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      letter-spacing: -0.01em;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }
    button, input, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
    button { cursor: pointer; background: none; border: none; }
    [hidden] { display: none !important; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    :focus-visible { outline: 2px solid var(--burg); outline-offset: 2px; }

    /* ── 인트로 / 언어 선택 ── */
    .intro {
      position: fixed; inset: 0; z-index: 200;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 32px 24px calc(32px + env(safe-area-inset-bottom));
      color: #fff; overflow-y: auto;
      background:
        radial-gradient(120% 70% at 50% 0%, #6A1A2A 0%, rgba(106,26,42,0) 60%),
        radial-gradient(90% 60% at 50% 110%, #2A0A12 0%, rgba(42,10,18,0) 70%),
        var(--burg-deep);
      transition: opacity .45s var(--ease), visibility .45s;
    }
    .intro.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
    html.direct .intro { display: none; }
    .intro-inner { width: 100%; max-width: 340px; text-align: center; animation: rise .8s var(--ease) both; }
    .intro-logo { width: 168px; height: auto; display: block; margin: 0 auto; filter: brightness(0) invert(1); }
    .intro-sub {
      font-family: var(--serif); font-style: italic; font-size: 17px;
      color: var(--gold-soft); margin-top: 14px; letter-spacing: .02em;
    }
    .intro-rule { width: 28px; height: 1px; background: var(--gold); margin: 28px auto; opacity: .7; }
    .intro-headline { font-size: 15px; font-weight: 500; color: rgba(255,255,255,.92); line-height: 1.7; }
    .intro-meta { font-size: 12px; color: rgba(255,255,255,.5); margin-top: 6px; letter-spacing: .02em; }
    .lang-list { margin-top: 36px; display: grid; gap: 8px; }
    .lang-btn {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; padding: 16px 20px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.03);
      color: #fff; text-align: left;
      transition: background .2s, border-color .2s, transform .2s var(--ease);
    }
    .lang-btn:hover, .lang-btn:focus-visible { border-color: var(--gold-soft); background: rgba(217,195,162,.08); }
    .lang-btn:active { transform: scale(.985); }
    .lang-btn.recent { border-color: rgba(217,195,162,.5); }
    .lang-native { font-size: 16px; font-weight: 600; }
    .lang-code { font-size: 11px; letter-spacing: .18em; color: rgba(255,255,255,.45); display: flex; align-items: center; gap: 10px; }
    .lang-code svg { opacity: .55; }
    .intro-foot { margin-top: 36px; font-size: 11px; color: rgba(255,255,255,.35); letter-spacing: .14em; text-transform: uppercase; }

    /* ── 헤더 ── */
    .header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(250,246,241,.86);
      -webkit-backdrop-filter: saturate(1.4) blur(14px); backdrop-filter: saturate(1.4) blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner {
      max-width: 600px; margin: 0 auto; height: 58px; padding: 0 20px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .header-logo { height: 20px; width: auto; display: block; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .step-count { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .step-count b { color: var(--burg); font-weight: 600; }
    .lang-pill {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600; letter-spacing: .06em; color: var(--text);
      padding: 6px 11px; border: 1px solid var(--line-strong); border-radius: 999px;
      background: var(--card); transition: border-color .2s;
    }
    .lang-pill:hover { border-color: var(--burg); }
    .progress { height: 2px; background: var(--line); }
    .progress-fill { height: 100%; width: 20%; background: linear-gradient(90deg, var(--burg), #A0334A); transition: width .5s var(--ease); }

    /* ── 레이아웃 ── */
    .wrap { max-width: 600px; margin: 0 auto; padding: 32px 20px calc(var(--bar-h) + 48px + env(safe-area-inset-bottom)); }

    .notice {
      display: flex; gap: 12px; align-items: flex-start;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 32px; box-shadow: var(--shadow);
    }
    .notice-icon {
      flex-shrink: 0; width: 28px; height: 28px; border-radius: 50%;
      background: var(--burg-tint); color: var(--burg);
      display: grid; place-items: center;
    }
    .notice-title { font-size: 13px; font-weight: 700; color: var(--burg); margin-bottom: 2px; }
    .notice-body { font-size: 13.5px; color: var(--text); line-height: 1.7; white-space: pre-line; }

    /* ── 단계 ── */
    .step { display: none; }
    .step.active { display: block; animation: rise .45s var(--ease) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .step-head { margin-bottom: 28px; }
    .step-kicker { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
    .step-num { font-family: var(--serif); font-size: 15px; color: var(--burg); font-weight: 500; letter-spacing: .04em; }
    .step-en { font-family: var(--serif); font-style: italic; font-size: 15px; color: var(--gold); }
    .step-title { font-size: 25px; font-weight: 700; color: var(--ink); line-height: 1.35; letter-spacing: -0.025em; outline: none; }
    .step-desc { font-size: 14.5px; color: var(--muted); margin-top: 8px; line-height: 1.7; }

    /* ── 질문 ── */
    .q-block { margin-bottom: 36px; scroll-margin-top: 90px; }
    .q-head { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 8px; margin-bottom: 12px; }
    .q-label { font-size: 15.5px; font-weight: 650; color: var(--ink); letter-spacing: -0.015em; }
    .q-req { color: var(--burg); margin-left: 2px; }
    .q-chip {
      font-size: 11.5px; font-weight: 500; color: var(--muted);
      background: var(--cream-2); border-radius: 999px; padding: 2px 9px;
    }
    .q-help { font-size: 13.5px; color: var(--muted); margin: -4px 0 14px; line-height: 1.7; }

    /* 옵션 카드 */
    .opts { display: grid; gap: 8px; }
    .opts.grid { grid-template-columns: 1fr 1fr; }
    .opts.grid .opt label { height: 100%; }
    .opt { position: relative; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt label {
      display: flex; align-items: center; gap: 12px;
      min-height: 54px; padding: 14px 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-size: 15px; line-height: 1.45; color: var(--text);
      cursor: pointer; user-select: none;
      transition: border-color .18s, background .18s, box-shadow .18s, transform .18s var(--ease);
    }
    .opt label:hover { border-color: var(--line-strong); }
    .opt label:active { transform: scale(.99); }
    .opt input:focus-visible + label { outline: 2px solid var(--burg); outline-offset: 2px; }
    .opt input:checked + label {
      border-color: var(--burg); background: var(--burg-tint); color: var(--ink); font-weight: 600;
      box-shadow: 0 0 0 1px var(--burg) inset;
    }
    .mark {
      flex-shrink: 0; width: 20px; height: 20px;
      border: 1.5px solid var(--line-strong); border-radius: 50%;
      display: grid; place-items: center; background: #fff;
      transition: background .18s, border-color .18s;
    }
    .opt.multi .mark { border-radius: 6px; }
    .mark svg { width: 12px; height: 12px; opacity: 0; transform: scale(.6); transition: opacity .18s, transform .22s var(--ease); }
    .opt input:checked + label .mark { background: var(--burg); border-color: var(--burg); }
    .opt input:checked + label .mark svg { opacity: 1; transform: none; }
    .opt.wide { grid-column: 1 / -1; }

    /* 서비스 카드 */

    /* 입력 */
    .field { display: block; }
    .input {
      width: 100%; height: 54px; padding: 0 16px;
      background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm);
      font-size: 16px; color: var(--ink); outline: none;
      transition: border-color .18s, box-shadow .18s;
      -webkit-appearance: none; appearance: none;
    }
    .input:hover { border-color: var(--line-strong); }
    .input:focus { border-color: var(--burg); box-shadow: 0 0 0 3px rgba(123,26,43,.10); }
    .input::placeholder { color: var(--faint); }
    .other-input { margin-top: 8px; display: none; }
    .other-input.show { display: block; animation: rise .3s var(--ease) both; }

    .q-block.invalid .input,
    .q-block.invalid .opt label { border-color: rgba(180,35,47,.45); }
    .err {
      display: none; align-items: center; gap: 6px;
      font-size: 13px; color: var(--danger); margin-top: 8px;
    }
    .q-block.invalid .err { display: flex; }

    /* 일행 공유 */
    .share {
      display: none; margin-top: 10px; padding: 14px 16px;
      border: 1px dashed var(--burg-line); border-radius: var(--radius-sm); background: #fff;
      align-items: center; justify-content: space-between; gap: 12px;
    }
    .share.show { display: flex; animation: rise .3s var(--ease) both; }
    .share-text { font-size: 13.5px; color: var(--text); line-height: 1.5; }
    .share-btn {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px;
      font-size: 13px; font-weight: 600; color: #fff; background: var(--burg);
      padding: 9px 14px; border-radius: 999px; transition: background .2s;
    }
    .share-btn:hover { background: var(--burg-ink); }

    /* 동의 */
    .consent { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .consent-all { padding: 16px 18px; background: var(--cream-2); border-bottom: 1px solid var(--line); }
    .consent-item { padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .consent-item:last-child { border-bottom: none; }
    .check { display: flex; align-items: flex-start; gap: 12px; cursor: pointer; user-select: none; }
    .check input { position: absolute; opacity: 0; pointer-events: none; }
    .check .mark { border-radius: 6px; margin-top: 1px; }
    .check input:checked + .mark { background: var(--burg); border-color: var(--burg); }
    .check input:checked + .mark svg { opacity: 1; transform: none; }
    .check input:focus-visible + .mark { outline: 2px solid var(--burg); outline-offset: 2px; }
    .check-text { font-size: 15px; font-weight: 600; color: var(--ink); line-height: 1.45; }
    .consent-all .check-text { font-weight: 700; }
    .tag-req, .tag-opt { font-size: 12px; font-weight: 600; margin-right: 4px; }
    .tag-req { color: var(--burg); }
    .tag-opt { color: var(--muted); }
    .consent-detail { font-size: 12.5px; color: var(--muted); line-height: 1.7; margin: 8px 0 0 32px; }
    .consent-detail dt { font-weight: 600; color: var(--text); display: inline; }
    .consent-detail dd { display: inline; }
    .consent-detail dd::after { content: ''; display: block; }
    .consent-link { display: inline-flex; margin: 8px 0 0 32px; font-size: 12.5px; font-weight: 600; color: var(--burg); text-decoration: underline; text-underline-offset: 3px; }
    #q-privacy > .err { margin: 10px 0 0 4px; }

    .biz { margin-top: 32px; font-size: 11.5px; color: var(--faint); line-height: 1.8; text-align: center; }

    /* 지점 표시 */
    .intro-branch {
      display: inline-block; margin-top: 18px; padding: 5px 14px; border-radius: 999px;
      border: 1px solid rgba(217,195,162,.45); color: var(--gold-soft); font-size: 13px; font-weight: 600; letter-spacing: .02em;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .header-branch { font-size: 12.5px; font-weight: 600; color: var(--burg); padding-left: 10px; border-left: 1px solid var(--line-strong); white-space: nowrap; }

    /* 날짜 & 시간 */
    .sub-label { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 8px; }
    .sub-label + .input { margin-bottom: 18px; }
    input[type="date"].input { line-height: 54px; }
    input[type="date"].input::-webkit-date-and-time-value { text-align: left; }
    .opts.times { grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .opts.times label { min-height: 46px; padding: 10px 4px; justify-content: center; font-size: 14.5px; font-variant-numeric: tabular-nums; }
    .opts.times .mark { display: none; }

    /* 메뉴판 */
    .menu { display: grid; gap: 12px; }
    .rec-note { font-size: 13px; color: var(--burg); background: var(--burg-tint); border-radius: 10px; padding: 10px 14px; }
    .mi-undecided label { align-items: flex-start; gap: 14px; padding: 20px 18px; border: 1.5px solid var(--burg); border-radius: 16px; background: linear-gradient(135deg, #fff 0%, var(--burg-tint) 100%); box-shadow: 0 6px 18px rgba(123,26,43,.08); }
    .mi-undecided .mark { width: 24px; height: 24px; margin-top: 1px; border-color: var(--burg); }
    .und-body { flex: 1; }
    .und-title { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 18px; font-weight: 800; color: var(--ink); letter-spacing: -0.02em; }
    .und-badge { font-size: 11.5px; font-weight: 700; color: #fff; background: var(--burg); border-radius: 999px; padding: 2px 9px; letter-spacing: 0; }
    .und-desc { display: block; margin-top: 6px; font-size: 13.5px; font-weight: 400; color: var(--muted); line-height: 1.6; }
    .mi-undecided input:checked + label { background: var(--burg); border-color: var(--burg); box-shadow: 0 8px 22px rgba(123,26,43,.28); }
    .mi-undecided input:checked + label .und-title { color: #fff; }
    .mi-undecided input:checked + label .und-badge { background: #fff; color: var(--burg); }
    .mi-undecided input:checked + label .und-desc { color: rgba(255,255,255,.85); }
    .mi-undecided input:checked + label .mark { background: #fff; border-color: #fff; }
    .mi-undecided input:checked + label .mark svg path { stroke: var(--burg); }
    .assure { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: 12px; background: var(--cream-2); }
    .assure-ico { flex-shrink: 0; width: 32px; height: 32px; border-radius: 50%; background: #fff; color: var(--burg); display: grid; place-items: center; }
    .assure strong { display: block; font-size: 14.5px; font-weight: 700; color: var(--ink); }
    .assure-body { display: block; margin-top: 2px; font-size: 13.5px; color: var(--text); line-height: 1.65; white-space: pre-line; }
    .test-cta { display: flex; align-items: center; gap: 12px; width: 100%; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--gold-soft); background: #fff; text-align: left; transition: border-color .2s; }
    .test-cta:hover { border-color: var(--gold); }
    .test-ico { flex-shrink: 0; width: 38px; height: 38px; border-radius: 12px; background: #F6EEDF; color: var(--gold); display: grid; place-items: center; }
    .test-txt { flex: 1; min-width: 0; }
    .test-txt strong { display: block; font-size: 15px; font-weight: 700; color: var(--ink); }
    .test-txt small { display: block; font-size: 12.5px; color: var(--muted); line-height: 1.5; margin-top: 2px; }
    .test-arrow { flex-shrink: 0; color: var(--gold); }
    .test-result { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 14px 16px; border-radius: 14px; background: #F6EEDF; }
    .test-result > div { min-width: 0; }
    .tr-k { display: block; font-size: 12px; font-weight: 600; color: var(--gold); }
    .tr-v { display: block; font-size: 16px; font-weight: 800; color: var(--ink); margin-top: 1px; }
    .tr-recs { display: block; font-size: 12.5px; color: var(--muted); margin-top: 3px; line-height: 1.5; }
    .sheet { position: fixed; inset: 0; z-index: 500; display: flex; flex-direction: column; background: var(--cream); }
    .sheet-bar { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; height: 54px; padding: 0 16px; border-bottom: 1px solid var(--line); background: #fff; }
    .sheet-bar strong { font-size: 15px; color: var(--ink); }
    .sheet-close { font-size: 14px; font-weight: 600; color: var(--muted); padding: 8px 4px; }
    .sheet iframe { flex: 1; width: 100%; border: 0; background: #fff; }
    .sheet-foot { flex-shrink: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--line); display: flex; }
    .sheet-foot .btn { flex: 1; }
    .menu-toggle { display: flex; align-items: center; gap: 8px; width: 100%; height: 50px; padding: 0 16px; border: 1px solid var(--line-strong); border-radius: 12px; background: #fff; font-size: 14.5px; font-weight: 600; color: var(--text); }
    .menu-toggle small { font-size: 12px; font-weight: 700; color: var(--burg); background: var(--burg-tint); border-radius: 999px; padding: 2px 8px; }
    .menu-toggle svg { margin-left: auto; color: var(--muted); transition: transform .2s; }
    .menu-toggle[aria-expanded="true"] svg { transform: rotate(180deg); }
    .menu-list { display: grid; gap: 12px; animation: rise .3s var(--ease) both; }
    .tier { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
    .tier-head { padding: 16px 16px 14px; }
    .tier-en { font-family: var(--serif); font-size: 26px; font-weight: 500; letter-spacing: .02em; line-height: 1; }
    .tier-sub { font-family: var(--serif); font-style: italic; font-size: 15px; margin-left: 8px; }
    .tier-desc { font-size: 12.5px; margin-top: 6px; line-height: 1.5; }
    .tier-core .tier-head { background: var(--cream-2); }
    .tier-core .tier-en { color: var(--burg); }
    .tier-core .tier-sub, .tier-core .tier-desc { color: var(--muted); }
    .tier-signature .tier-head { background: linear-gradient(135deg, #5A1020, var(--burg)); color: #fff; }
    .tier-signature .tier-sub, .tier-signature .tier-desc { color: rgba(255,255,255,.8); }
    .tier-prestige .tier-head { background: linear-gradient(135deg, #1E1214, #33262A); color: #fff; }
    .tier-prestige .tier-en { color: var(--gold-soft); }
    .tier-prestige .tier-sub, .tier-prestige .tier-desc { color: rgba(255,255,255,.72); }

function buildForm() {
  const root = $('#steps');
  STEPS.forEach((step, i) => {
    const sec = h('section', { class:'step', id:`step${i+1}`, 'aria-labelledby':`stitle${i+1}` });
    sec.innerHTML = `
      <div class="step-head">
        <div class="step-kicker"><span class="step-num">0${i+1}</span><span class="step-en">${step.en}</span></div>
        <h1 class="step-title" id="stitle${i+1}" tabindex="-1" data-t="${step.title}"></h1>
        <p class="step-desc" data-t="${step.desc}"></p>
      </div>`;
    step.qs.forEach(q => sec.appendChild(buildQuestion(q)));
    root.appendChild(sec);
  });
  // 앞 질문의 특정 보기를 골랐을 때만 보이는 질문 (숨기면 답도 지움)
  STEPS.flatMap(s => s.qs).filter(q => q.showIf).forEach(q => {
    const [ctrl, key] = q.showIf, block = $(`#q-${q.name}`);
    const sync = () => {
      const on = $(`#${ctrl}-${key}`).checked;
      block.hidden = !on;
      if (!on) $$(`input[name="${q.name}"]`).forEach(x => { x.checked = false; });
    };
    $(`#q-${ctrl}`).addEventListener('change', sync);
    sync();
  });
}

function buildQuestion(q) {
  const block = h('div', { class:'q-block', id:`q-${q.name}` });
  if (q.type === 'consent') { block.innerHTML = consentHTML(); return block; }

  const labelId = `lbl-${q.name}`;
  let head = `<div class="q-head"><span class="q-label" id="${labelId}" data-t="${q.label}"></span>${q.req ? '<span class="q-req" aria-hidden="true">*</span>' : ''}`;
  if (q.chip) head += `<span class="q-chip" data-t="${q.chip}"></span>`;
  if (q.chip2) head += `<span class="q-chip" data-t="${q.chip2}"></span>`;
  head += '</div>';
  if (q.help) head += `<p class="q-help" data-t="${q.help}"></p>`;
  block.innerHTML = head;

  if (q.type === 'menu') {
    block.appendChild(buildMenu(q.name));
  } else if (q.type === 'text' || q.type === 'tel' || q.type === 'date') {
    const input = h('input', {
      class:'input', type:q.type, id:q.name, name:q.name, 'aria-labelledby':labelId,
      autocomplete:q.autocomplete || 'off',
    });
    if (q.ph) input.setAttribute('data-tph', q.ph);
    if (q.maxlength) input.setAttribute('maxlength', q.maxlength);
    if (q.type === 'date') input.min = todayStr();
    if (q.inputmode) input.setAttribute('inputmode', q.inputmode);
    if (q.req) input.setAttribute('aria-required', 'true');
    if (q.format) input.addEventListener('input', () => formatInput(input, q.format));
    block.appendChild(input);
  } else {
    const multi = q.type === 'checkbox';
    const times = q.type === 'times';
    const opts = h('div', { class:`opts${q.grid ? ' grid' : ''}${times ? ' times' : ''}`, role: multi ? 'group' : 'radiogroup', 'aria-labelledby':labelId });
    (times ? TIMES : q.opts).forEach(o => {
      const key = o;
      const id = `${q.name}-${key.replace(':', '')}`;
      const wrap = h('div', { class:`opt${multi ? ' multi' : ''}${q.wide?.includes(key) ? ' wide' : ''}` });
      const input = h('input', { type: multi ? 'checkbox' : 'radio', name:q.name, id, value: times ? key : storedValue(key), 'data-key':key });
      const label = h('label', { for:id });
      if (times) {
        label.innerHTML = `<span class="mark">${ICON_CHECK}</span><span>${key}</span>`;
      } else {
        label.innerHTML = `<span class="mark">${ICON_CHECK}</span><span data-t="${key}"></span>`;
      }
      wrap.append(input, label);
      opts.appendChild(wrap);
    });
    block.appendChild(opts);

    if (q.details) {
      // '기타', '지인 소개' 등을 고르면 상세 입력칸 표시
      const detail = h('input', { class:'input other-input', type:'text', id:`${q.name}-other`, maxlength:100, 'aria-label':'detail' });
      block.appendChild(detail);
      opts.addEventListener('change', e => {
        const key = Object.keys(q.details).find(k => $(`#${q.name}-${k}`).checked);
        detail.classList.toggle('show', !!key);
        if (!key) return;
        detail.dataset.tph = q.details[key];
        detail.placeholder = T[lang][q.details[key]];
        if (e.target.dataset.key === key) setTimeout(() => detail.focus(), 50);
      });
    }
    if (q.none) {
      // '해당 없음' · '처음이에요'는 다른 보기와 함께 고를 수 없음
      opts.addEventListener('change', e => {
        if (!e.target.checked) return;
        const none = $(`#${q.name}-${q.none}`);
        if (e.target === none) $$(`input[name="${q.name}"]`).forEach(x => { if (x !== none) x.checked = false; });
        else none.checked = false;
      });
    }
    if (q.share) {
      const share = h('div', { class:'share', id:'shareBox' });
      share.innerHTML = `<span class="share-text" data-t="share_text"></span><button type="button" class="share-btn">${ICON_SHARE}<span data-t="share_btn"></span></button>`;
      $('button', share).addEventListener('click', shareLink);
      block.appendChild(share);
      opts.addEventListener('change', () => share.classList.toggle('show', $(`#${q.name}-${q.share}`).checked));
    }
  }

  if (q.err) block.appendChild(h('div', { class:'err', role:'alert' }, `${ICON_ERR}<span data-t="${q.err}"></span>`));
  return withEvents(block);
}

        <span class="mi-price intl-only"><b>₩${won(it.reg)}</b></span></span>`)));

// 앞 단계 답변으로 메뉴에 '추천' 표시 (직원도 손님 성향을 미리 짐작할 수 있음)
function updateRecs() {
  const has = (name, keys) => checked(name).some(x => keys.includes(x.dataset.key));
  let recs = [], fromTest = false;
  if (has('cautions', ['ct1', 'ct2'])) recs = ['c5'];
  else if (scalpTest && SCALP_TEST[scalpTest.type]) { recs = [...SCALP_TEST[scalpTest.type].recs]; fromTest = true; }
  else {
    if (has('scalpConcerns', ['sc1']) || has('hairLossGenetic', ['hg1'])) recs.push('c4', 'p2');
    if (has('scalpConcerns', ['sc2', 'sc3', 'sc6', 'sc7'])) recs.push('c3');
    if (has('scalpConcerns', ['sc4', 'sc5', 'sc8'])) recs.push('s1');
    if (has('consultationType', ['c1'])) recs.push('s2', 's5');
  }
  recs = [...new Set(recs)].slice(0, 3);
  $$('.mi').forEach(box => { $('.rec', box).hidden = !recs.includes(box.dataset.id); });
  $('#recNote').hidden = !recs.length;
  $('#recNote').textContent = fromTest ? T[lang].rec_note_test.replace('{t}', SCALP_TEST[scalpTest.type].ko) : T[lang].rec_note;
  $('#recCount').hidden = !recs.length;
  $('#recCount').textContent = T[lang].rec_count.replace('{n}', recs.length);
}

// 두피 자가진단(/scalp-test)을 설문 위에 띄우고, 결과를 받아 추천에 반영 (입력한 설문 내용은 그대로 유지)
function openScalpTest() {
  let sheet = $('#testSheet');

    sheet = h('div', { class:'sheet', id:'testSheet', role:'dialog', 'aria-modal':'true', hidden:'' },

    document.body.appendChild(sheet);
    $('#testClose').addEventListener('click', closeScalpTest);

function closeScalpTest() {
  $('#testSheet').hidden = true;

window.addEventListener('message', e => {
  if (e.origin !== location.origin || e.data?.type !== 'scalpit:scalp-test') return;
  const r = e.data.result || {};
  if (!SCALP_TEST[r.type]) return;
  scalpTest = { type: r.type, scores: r.scores || null };

function renderTestResult() {

}

// ── 입력 포맷 ──
function formatInput(input, kind) {
  const d = input.value.replace(/\D/g, '');
  if (kind === 'date') {
    const s = d.slice(0, 8);
    input.value = s.length > 6 ? `${s.slice(0,4)}.${s.slice(4,6)}.${s.slice(6)}` : s.length > 4 ? `${s.slice(0,4)}.${s.slice(4)}` : s;
  }
  if (kind === 'phone' && /^01/.test(d) && !/[+]/.test(input.value)) {
    const s = d.slice(0, 11);
    input.value = s.length > 7 ? `${s.slice(0,3)}-${s.slice(3, s.length - 4)}-${s.slice(-4)}`
      : s.length > 3 ? `${s.slice(0,3)}-${s.slice(3)}` : s;
  }
}

function validBirth(v) {
  const m = v.match(/^(\d{4})\.(\d{2})\.(\d{2})$/);
  if (!m) return false;
  const [y, mo, d] = [+m[1], +m[2], +m[3]];
  const dt = new Date(y, mo - 1, d);
  return y >= 1920 && dt <= new Date() && dt.getMonth() === mo - 1 && dt.getDate() === d;
}

// ── 단계 이동 ──
function updateNav() {
  const t = T[lang];
  const last = current === STEPS.length - 1;
  $('#btnNext').innerHTML = submitting
    ? `<span class="spinner"></span><span>${t.btn_ing}</span>`
    : `<span>${last ? t.btn_submit : t.btn_next}</span>${last ? '' : ICON_ARROW}`;
  $('#btnBack').hidden = current === 0;
  $('#stepCount').innerHTML = t.step_of(current + 1, STEPS.length);
  $('#progressFill').style.width = `${((current + 1) / STEPS.length) * 100}%`;
  $('#progress').setAttribute('aria-valuenow', current + 1);
}

function showStep(n, focus = true) {
  $$('.step').forEach(s => s.classList.remove('active'));
  $(`#step${n + 1}`).classList.add('active');
  $('#notice').hidden = n !== 0;
  if (n === STEPS.length - 1) updateRecs();
  current = n;
  updateNav();
  window.scrollTo({ top: 0, behavior: focus ? 'smooth' : 'auto' });
  if (focus) $(`#stitle${n + 1}`).focus({ preventScroll: true });
}

function checked(name) { return $$(`input[name="${name}"]:checked`); }

function validateStep(i) {
  const bad = [];
  STEPS[i].qs.forEach(q => {
    let ok = true;
    if (q.type === 'consent') ok = $('#privacyRequired').checked && $('#sensitiveRequired').checked;
    else if (!q.req) ok = true;
    else if (q.type === 'date') { const v = $(`#${q.name}`).value; ok = !!v && v >= todayStr(); }
    else if (q.type === 'text' || q.type === 'tel') {
      const v = $(`#${q.name}`).value.trim();
      if (q.format === 'date') ok = validBirth(v);
      else if (q.format === 'phone') ok = v.replace(/\D/g, '').length >= 9;
      else ok = v.length > 0;
    } else ok = checked(q.name).length > 0;
    $(`#q-${q.name}`).classList.toggle('invalid', !ok);
    if (!ok) bad.push($(`#q-${q.name}`));
  });
  if (bad.length) {
    bad[0].scrollIntoView({ behavior:'smooth', block:'center' });
    const focusable = $('input', bad[0]);
    if (focusable && !['radio', 'checkbox', 'date'].includes(focusable.type)) setTimeout(() => focusable.focus({ preventScroll:true }), 300);
  }
  return !bad.length;
}

function onNext() {
  if (submitting) return;
  if (!validateStep(current)) return;
  if (current < STEPS.length - 1) showStep(current + 1);
  else submitForm();
}

// ── 공유 ──
async function shareLink() {
  const url = `${location.origin}${location.pathname}?from=share`; // 손님 공유로 들어온 일행을 구분
  if (navigator.share) {
    try { await navigator.share({ title: document.title, url }); return; } catch (e) { if (e.name === 'AbortError') return; }
  }
  try { await navigator.clipboard.writeText(url); toast(T[lang].share_copied); }
  catch { prompt('', url); }
}

let toastTimer;
function toast(msg) {
  const el = $('#toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

const QUESTIONS = Object.fromEntries(STEPS.flatMap(s => s.qs).map(q => [q.name, q]));
function withDetail(name) {
  const details = QUESTIONS[name].details || {};
  const text = $(`#${name}-other`)?.value.trim();
  return checked(name).map(x => details[x.dataset.key] && text ? `${x.value} (${text})` : x.value);
}

async function submitForm() {
  const t = T[lang];
  const name = $('#name').value.trim();
  const birth = $('#birth').value.trim();
  const data = {
    lang,
    reservationType: checked('reservationType')[0]?.value || '',
    consultationType: checked('consultationType')[0]?.value || '',
    visitDate: $('#visitDate').value,
    visitTime: checked('visitTime')[0]?.value || '',
    nameBirth: `${name} / ${birth}`,
    name,
    phone: $('#phone').value.trim(),
    address: $('#address').value.trim(),
    treatmentHistory: checked('treatmentHistory').map(x => x.value),
    visitSource: withDetail('visitSource')[0] || '',
    scalpConcerns: withDetail('scalpConcerns'),
    hairLossGenetic: checked('hairLossGenetic')[0]?.value || '',
    cautions: checked('cautions').map(x => x.value),
    // 관리자 화면의 '임신 / 수유' 표시와 이전 접수 건과 같은 형식 유지
    pregnancyStatus: $('#cautions-ct1').checked ? '임신 중' : $('#cautions-ct2').checked ? '수유 중' : '해당 없음',
    desiredServices: checked('desiredServices').map(x => x.value),
    videoConsent: checked('videoConsent')[0]?.value || '',
    privacyConsent: $('#privacyRequired').checked,
    sensitiveConsent: $('#sensitiveRequired').checked,
    marketingConsent: $('#privacyMarketing').checked,
    tracking: TRACKING,
    scalpTest: scalpTest || undefined,
  };

  submitting = true; $('#btnNext').disabled = true; updateNav();
  try {
    const res = await fetch('/api/submit' + branchParam, {
      method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(data),
    });
    if (res.status === 429) throw new Error('rate');
    const json = await res.json().catch(() => ({}));
    if (!res.ok || !json.success) throw new Error('server');
    dirty = false;
    showDone(data);
  } catch (e) {
    toast(e.message === 'rate' ? t.err_rate : e.message === 'server' ? t.err_server : t.err_network);
  } finally {
    submitting = false; $('#btnNext').disabled = false; updateNav();
  }
}

function showDone(data) {
  const t = T[lang];
  const label = name => checked(name).map(x => name === 'desiredServices' ? menuName(x.dataset.key) : t[x.dataset.key]).join(', ');
  const rows = [
    [t.done_name, data.name],
    [t.done_phone, data.phone],
    [t.done_when, `${data.visitDate.replace(/-/g, '.')} ${data.visitTime}`],
    branch.slug !== 'root' && [t.done_branch, branch.name],
    [t.done_serv, label('desiredServices')],
  ].filter(Boolean);
  const box = $('#summary'); box.innerHTML = '';
  rows.forEach(([k, v]) => {
    const row = h('div', { class:'summary-row' });
    const key = h('span', { class:'summary-key' }), val = h('span', { class:'summary-val' });
    key.textContent = k; val.textContent = v;
    row.append(key, val);
    box.appendChild(row);
  });
  $('#visitCard').replaceChildren(...visitCard(data));
  $('#brandBox').replaceChildren(...brandBox());
  ['#form', '#actionbar', '#stepCount', '#langPill'].forEach(s => $(s).hidden = true);
  $('#progressFill').style.width = '100%';
  $('#done').classList.add('show');
  window.scrollTo({ top: 0 });
}

const ICON_PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11.5a7 7 0 1114 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';

const ICON_CAL = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>';

// 지점 주소·지도·연락처·캘린더·카카오 채널 (방문 전 노쇼를 줄이고 채널 친구를 확보)
function visitCard(data) {
  if (branch.slug === 'root') return [];
  const t = T[lang];
  const link = (cls, href, html) => { const a = h('a', { class: cls, href, target: '_blank', rel: 'noopener' }, html); return a; };
  const card = h('div', { class: 'visit-card' });
  const head = h('div', { class: 'visit-head' });
  head.append(h('span', { class: 'visit-title' }), h('span', { class: 'visit-branch' }));
  head.children[0].textContent = t.visit_title; head.children[1].textContent = branch.name;
  const addr = h('div', { class: 'visit-addr' }, ICON_PIN);
  const addrText = h('span'); addrText.textContent = branch.address;
  const copy = h('button', { type: 'button', class: 'mini-btn' }); copy.textContent = t.addr_copy;
  copy.addEventListener('click', async () => { try { await navigator.clipboard.writeText(branch.address); toast(t.copied); } catch { prompt('', branch.address); } });
  addr.append(addrText, copy);
  card.append(head, addr);
  if (branch.parking) { const p = h('p', { class: 'visit-note' }); p.textContent = `${t.parking_k} · ${branch.parking}`; card.appendChild(p); }

  const maps = [['naver', branch.naverMapUrl, t.map_naver], ['kakao', branch.kakaoMapUrl, t.map_kakao], ['google', branch.googleMapUrl, t.map_google]];
  if (lang !== 'ko') maps.unshift(maps.pop()); // 외국인은 구글 지도를 먼저
  const mapRow = h('div', { class: 'map-row' });
  maps.filter(m => m[1]).forEach(([k, href, label]) => { const a = link(`map-btn map-${k}`, href, ''); a.textContent = label; mapRow.appendChild(a); });
  card.appendChild(mapRow);

  const actions = h('div', { class: 'visit-actions' });
  if (branch.phone) { const a = h('a', { class: 'act-btn', href: `tel:${branch.phone.replace(/[^\d+]/g, '')}` }, `${ICON_PHONE}<span></span>`); a.lastChild.textContent = t.call; actions.appendChild(a); }
  if (data.visitDate && data.visitTime) {
    const b = h('button', { type: 'button', class: 'act-btn' }, `${ICON_CAL}<span></span>`); b.lastChild.textContent = t.cal_add;
    b.addEventListener('click', () => downloadICS(data));
    actions.appendChild(b);
  }
  if (actions.children.length) card.appendChild(actions);

  const out = [card];
  if (branch.kakaoChannelUrl) {
    const k = link('kakao-btn', branch.kakaoChannelUrl, '<span class="kakao-ico">TALK</span><span class="kakao-txt"><strong></strong><small></small></span>');
    k.querySelector('strong').textContent = t.kakao_ch; k.querySelector('small').textContent = t.kakao_ch_desc;
    out.push(k);
  }
  if (branch.instagramUrl) { const a = link('insta-btn', branch.instagramUrl, ''); a.textContent = t.insta; out.push(a); }
  return out;
}

// 브랜드 소개 영상 + 자주 묻는 질문 (제출 후 화면에서만 노출 → 설문 작성률에 영향 없음)
const BRAND_VIDEO = '-Yf4cOHxKrM'; // YouTube 영상 ID (https://youtu.be/ 뒤 부분)
const VIDEO_INLINE = true;          // 화면 안에서 바로 재생
const ICON_PLAY = '<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 001.5.86l10.5-6.5a1 1 0 000-1.72L9.5 4.64A1 1 0 008 5.5z"/></svg>';
function brandBox() {
  const t = T[lang], out = [];
  if (BRAND_VIDEO) {
    const sec = h('section', { class: 'brand-sec' }, `<h2 class="brand-title"></h2><p class="brand-sub"></p>
      <a class="video" href="https://youtu.be/${BRAND_VIDEO}" target="_blank" rel="noopener">
        <img src="https://i.ytimg.com/vi/${BRAND_VIDEO}/hqdefault.jpg" alt="" loading="lazy" />
        <span class="video-play">${ICON_PLAY}</span><span class="video-label"></span></a>`);
    $('.brand-title', sec).textContent = t.vid_title;
    $('.brand-sub', sec).textContent = t.vid_sub;
    $('.video-label', sec).textContent = t.vid_label;
    $('.video img', sec).addEventListener('error', e => e.target.remove());
    $('.video', sec).addEventListener('click', e => {
      if (!VIDEO_INLINE) return;
      e.preventDefault();
      const box = h('div', { class: 'video' });
      box.appendChild(h('iframe', { src: `https://www.youtube-nocookie.com/embed/${BRAND_VIDEO}?autoplay=1&playsinline=1&rel=0`, title: t.vid_label, allow: 'autoplay; encrypted-media; picture-in-picture; fullscreen', allowfullscreen: '' }));
      e.currentTarget.replaceWith(box);
    });
    out.push(sec);
  }
  const faq = h('section', { class: 'brand-sec' }, '<h2 class="brand-title"></h2><div class="faq"></div>');
  $('.brand-title', faq).textContent = t.faq_title;
  t.faq.forEach(([q, a, id]) => {
    const d = h('details', {}, '<summary></summary><p></p>');
    // 지점 주차 안내가 등록돼 있으면 그 내용으로 답변
    $('summary', d).textContent = q; $('p', d).textContent = id === 'parking' && lang === 'ko' && branch.parking ? branch.parking : a;
    $('.faq', faq).appendChild(d);
  });
  out.push(faq);
  return out;
}

// 방문 일정을 휴대폰 캘린더에 저장 (.ics)
function downloadICS(data) {
  const [y, m, d] = data.visitDate.split('-').map(Number);
  const [hh, mm] = data.visitTime.split(':').map(Number);
  const pad = n => String(n).padStart(2, '0');
  const stamp = dt => `${dt.getFullYear()}${pad(dt.getMonth() + 1)}${pad(dt.getDate())}T${pad(dt.getHours())}${pad(dt.getMinutes())}00`;
  const start = new Date(y, m - 1, d, hh, mm), end = new Date(start.getTime() + 90 * 60000);
  const esc = v => String(v).replace(/[\\,;]/g, c => '\\' + c);
  const ics = [
    'BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Scalpit//Consultation//KO', 'BEGIN:VEVENT',
    `UID:${Date.now()}@scalpitform.com`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART;TZID=Asia/Seoul:${stamp(start)}`, `DTEND;TZID=Asia/Seoul:${stamp(end)}`,
    `SUMMARY:${esc(T[lang].cal_title.replace('{b}', branch.name))}`, `LOCATION:${esc(branch.address)}`,
    'BEGIN:VALARM', 'TRIGGER:-PT2H', 'ACTION:DISPLAY', 'DESCRIPTION:Scálpit', 'END:VALARM',
    'END:VEVENT', 'END:VCALENDAR',
  ].join('\r\n');
  const a = h('a', { href: 'data:text/calendar;charset=utf-8,' + encodeURIComponent(ics), download: 'scalpit.ics' });
  document.body.appendChild(a); a.click(); a.remove();
}

// ── 초기화 ──
buildForm();
wireConsent();
loadBranch();
$$('.lang-btn').forEach(b => b.addEventListener('click', () => selectLang(b.dataset.lang)));
$('#langPill').addEventListener('click', () => { document.documentElement.classList.remove('direct'); $('#intro').classList.remove('hidden'); });
$('#btnNext').addEventListener('click', onNext);
$('#btnBack').addEventListener('click', () => current > 0 && showStep(current - 1));
$('#form').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input.input')) { e.preventDefault(); onNext(); }
});
window.addEventListener('beforeunload', e => { if (dirty) { e.preventDefault(); e.returnValue = ''; } });
try {
  const saved = localStorage.getItem('scalpit-lang');
  if (saved) $(`.lang-btn[data-lang="${saved}"]`)?.classList.add('recent');
} catch {}
applyLang();
if (!isGlobal) selectLang('ko');
</script>
