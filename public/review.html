<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6F1" />
  <meta name="color-scheme" content="light" />
  <title>Scálpit | 오늘 서비스 어떠셨나요?</title>
  <meta property="og:title" content="Scálpit | 오늘 서비스 어떠셨나요?" />
  <meta property="og:description" content="소중한 한마디가 더 나은 서비스를 만들어요." />
  <meta property="og:image" content="https://scalpitform.com/og.png" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --burg: #7B1A2B; --burg-ink: #5A1020; --burg-tint: #FBF3F2;
      --cream: #FAF6F1; --cream-2: #F3EBE2; --card: #FFFFFF;
      --gold: #B08D62; --star: #C9A06A;
      --ink: #1E1214; --text: #3A2A2B; --muted: #7D6C6B; --faint: #A99B98;
      --line: #EBE1D8; --line-strong: #DCCDC1; --danger: #B4232F;
      --radius: 14px; --radius-sm: 10px;
      --shadow: 0 1px 2px rgba(58,16,24,.04), 0 4px 16px rgba(58,16,24,.04);
      --ease: cubic-bezier(.2,.7,.2,1);
      --sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      --serif: 'Cormorant Garamond', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    [hidden] { display: none !important; }
    body { font-family: var(--sans); background: var(--cream); color: var(--text); min-height: 100vh; line-height: 1.6; letter-spacing: -0.01em; -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    button, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
    button { cursor: pointer; background: none; border: none; }
    :focus-visible { outline: 2px solid var(--burg); outline-offset: 2px; }

    .header { position: sticky; top: 0; z-index: 10; background: rgba(250,246,241,.88); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
    .header-inner { max-width: 560px; margin: 0 auto; height: 58px; padding: 0 20px; display: flex; align-items: center; gap: 10px; }
    .header-inner img { height: 20px; }
    .header-branch { font-size: 12.5px; font-weight: 600; color: var(--burg); padding-left: 10px; border-left: 1px solid var(--line-strong); }

    .wrap { max-width: 560px; margin: 0 auto; padding: 36px 20px calc(120px + env(safe-area-inset-bottom)); }
    .hero { text-align: center; margin-bottom: 32px; animation: rise .5s var(--ease) both; }
    .hero-en { font-family: var(--serif); font-style: italic; font-size: 17px; color: var(--gold); }
    .hero-title { font-size: 25px; font-weight: 700; color: var(--ink); margin-top: 4px; letter-spacing: -0.025em; }
    .hero-desc { font-size: 14.5px; color: var(--muted); margin-top: 8px; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px 20px; box-shadow: var(--shadow); margin-bottom: 14px; }
    .q-label { font-size: 15.5px; font-weight: 650; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .q-req { color: var(--burg); }
    .q-chip { font-size: 11.5px; font-weight: 500; color: var(--muted); background: var(--cream-2); border-radius: 999px; padding: 2px 9px; }
    .center { text-align: center; }
    .center .q-label { justify-content: center; }

    .stars { display: flex; justify-content: center; gap: 6px; margin-top: 14px; }
    .stars.small { gap: 2px; margin-top: 8px; justify-content: flex-start; }
    .star { padding: 4px; color: var(--line-strong); transition: color .15s, transform .2s var(--ease); }
    .star svg { width: 40px; height: 40px; display: block; }
    .stars.small .star svg { width: 30px; height: 30px; }
    .star.on { color: var(--star); }
    .star:active { transform: scale(.9); }
    .star-label { text-align: center; font-size: 14px; font-weight: 600; color: var(--burg); min-height: 22px; margin-top: 6px; }
    .stars.small + .star-label { text-align: left; margin-top: 0; font-size: 13px; }
    .sub-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .sub-row .q-label { font-size: 14.5px; }

    .opts { display: grid; gap: 8px; margin-top: 14px; }
    .opt input { position: absolute; opacity: 0; pointer-events: none; }
    .opt label { display: flex; align-items: center; gap: 12px; min-height: 54px; padding: 12px 16px; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius-sm); font-size: 15px; cursor: pointer; transition: border-color .18s, background .18s, box-shadow .18s; }
    .opt label:hover { border-color: var(--line-strong); }
    .opt input:checked + label { border-color: var(--burg); background: var(--burg-tint); color: var(--ink); font-weight: 600; box-shadow: 0 0 0 1px var(--burg) inset; }
    .opt input:focus-visible + label { outline: 2px solid var(--burg); outline-offset: 2px; }
    .emoji { font-size: 20px; }

    textarea { width: 100%; margin-top: 12px; min-height: 96px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--card); font-size: 16px; line-height: 1.6; color: var(--ink); outline: none; resize: vertical; transition: border-color .18s, box-shadow .18s; }
    textarea:focus { border-color: var(--burg); box-shadow: 0 0 0 3px rgba(123,26,43,.10); }
    textarea::placeholder { color: var(--faint); }

    .err { display: none; text-align: center; font-size: 13px; color: var(--danger); margin-top: 6px; }
    .card.invalid { border-color: rgba(180,35,47,.45); }
    .card.invalid .err { display: block; }

    .actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(to top, var(--cream) 70%, rgba(250,246,241,0)); }
    .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; max-width: 520px; margin: 0 auto; height: 56px; border-radius: 14px; background: var(--burg); color: #fff; font-size: 16px; font-weight: 650; box-shadow: 0 6px 20px rgba(123,26,43,.22); transition: background .2s, opacity .2s, transform .15s var(--ease); }
    .btn:hover { background: var(--burg-ink); }
    .btn:active { transform: scale(.985); }
    .btn:disabled { opacity: .6; cursor: progress; }

    .done { display: none; max-width: 440px; margin: 0 auto; padding: 72px 20px; text-align: center; }
    .done.show { display: block; animation: rise .6s var(--ease) both; }
    .done-mark { width: 72px; height: 72px; margin: 0 auto 28px; border-radius: 50%; background: var(--burg); color: #fff; display: grid; place-items: center; box-shadow: 0 0 0 10px var(--burg-tint); }
    .done-mark path { stroke-dasharray: 30; stroke-dashoffset: 30; animation: draw .5s .25s var(--ease) forwards; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    .done-title { font-size: 24px; font-weight: 700; color: var(--ink); margin-top: 6px; }
    .done-desc { font-size: 15px; color: var(--muted); margin-top: 10px; line-height: 1.8; }
    .done-logo { width: 96px; margin: 40px auto 0; display: block; opacity: .85; }

    @media (max-width: 520px) { .sub-row { grid-template-columns: 1fr; gap: 20px; } }
    @media (max-width: 380px) { .star svg { width: 36px; height: 36px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
<header class="header"><div class="header-inner"><img src="/scalpit-logo.png" alt="Scálpit" /><span class="header-branch" id="headerBranch" hidden></span></div></header>

<main class="wrap" id="formSection">
  <div class="hero">
    <div class="hero-en">How was your visit?</div>
    <h1 class="hero-title">오늘 서비스 어떠셨나요?</h1>
    <p class="hero-desc">솔직한 한마디가 스칼프잇을 더 좋게 만들어요.</p>
  </div>

  <section class="card center" id="q-overall">
    <div class="q-label">전체적인 만족도<span class="q-req">*</span></div>
    <div class="stars" data-group="overall" role="radiogroup" aria-label="전체 만족도"></div>
    <div class="star-label" id="label-overall"></div>
    <div class="err" role="alert">전체 만족도를 선택해주세요.</div>
  </section>

  <section class="card sub-row">
    <div>
      <div class="q-label">직원 응대 <span class="q-chip">선택</span></div>
      <div class="stars small" data-group="staff" role="radiogroup" aria-label="직원 응대"></div>
      <div class="star-label" id="label-staff"></div>
    </div>
    <div>
      <div class="q-label">관리 결과 <span class="q-chip">선택</span></div>
      <div class="stars small" data-group="result" role="radiogroup" aria-label="관리 결과"></div>
      <div class="star-label" id="label-result"></div>
    </div>
  </section>

  <section class="card">
    <div class="q-label">다음에 또 방문하실 의향이 있으신가요? <span class="q-chip">선택</span></div>
    <div class="opts" role="radiogroup">
      <div class="opt"><input type="radio" name="revisit" id="rv1" value="yes" /><label for="rv1"><span class="emoji">😍</span> 당연하죠! 또 올게요</label></div>
      <div class="opt"><input type="radio" name="revisit" id="rv2" value="maybe" /><label for="rv2"><span class="emoji">🤔</span> 고민 중이에요</label></div>
      <div class="opt"><input type="radio" name="revisit" id="rv3" value="no" /><label for="rv3"><span class="emoji">😔</span> 아마 아닐 것 같아요</label></div>
    </div>
  </section>

  <section class="card">
    <div class="q-label">한 줄 후기를 남겨주세요 <span class="q-chip">선택</span></div>
    <textarea id="comment" maxlength="1000" placeholder="예: 두피가 시원해지는 느낌이 너무 좋았어요!"></textarea>
  </section>

  <section class="card">
    <div class="q-label">불편하셨던 점이 있으셨나요? <span class="q-chip">선택</span></div>
    <textarea id="improvement" maxlength="1000" placeholder="솔직하게 말씀해 주세요. 바로 개선할게요!&#10;예: 대기 시간이 조금 길었어요"></textarea>
  </section>
</main>

<nav class="actionbar" id="actionbar"><button class="btn" id="submitBtn" type="button">리뷰 보내기</button></nav>

<section class="done" id="done" aria-live="polite">
  <div class="done-mark"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
  <div class="hero-en">Thank you</div>
  <h1 class="done-title">감사합니다!</h1>
  <p class="done-desc">소중한 리뷰가 잘 전달되었어요.<br>더 좋은 서비스로 보답하겠습니다.</p>
  <img src="/scalpit-logo.png" alt="Scálpit" class="done-logo" />
</section>

<script>
const $ = s => document.querySelector(s);
const firstSeg = location.pathname.split('/').filter(Boolean)[0] || '';
const branchSlug = /^review/.test(firstSeg) ? '' : firstSeg;
const branchParam = branchSlug ? `?b=${encodeURIComponent(branchSlug)}` : '';

fetch('/api/branch' + branchParam).then(r => r.json()).then(b => {
  if (b.slug === 'root') return;
  $('#headerBranch').textContent = b.name; $('#headerBranch').hidden = false;
  document.title = `Scálpit ${b.name} | 오늘 서비스 어떠셨나요?`;
}).catch(() => {});

const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.8l2.75 5.82 6.35.8-4.66 4.4 1.18 6.3L12 17.07 6.38 20.12l1.18-6.3L2.9 9.42l6.35-.8z"/></svg>';
const TEXTS = ['', '아쉬웠어요', '조금 아쉬웠어요', '보통이에요', '좋았어요', '최고였어요!'];
const ratings = { overall: 0, staff: 0, result: 0 };
let sent = false, dirty = false;

document.querySelectorAll('.stars').forEach(box => {
  const group = box.dataset.group;
  for (let v = 1; v <= 5; v++) {
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'star'; b.innerHTML = STAR;
    b.setAttribute('role', 'radio'); b.setAttribute('aria-label', `${v}점`); b.setAttribute('aria-checked', 'false');
    b.addEventListener('click', () => {
      ratings[group] = v; dirty = true;
      box.querySelectorAll('.star').forEach((s, i) => { s.classList.toggle('on', i < v); s.setAttribute('aria-checked', String(i === v - 1)); });
      $(`#label-${group}`).textContent = TEXTS[v];
      if (group === 'overall') $('#q-overall').classList.remove('invalid');
    });
    box.appendChild(b);
  }
});
document.querySelectorAll('textarea, input').forEach(el => el.addEventListener('input', () => { dirty = true; }));

$('#submitBtn').addEventListener('click', async () => {
  if (sent) return;
  if (!ratings.overall) {
    $('#q-overall').classList.add('invalid');
    $('#q-overall').scrollIntoView({ behavior:'smooth', block:'center' });
    return;
  }
  const btn = $('#submitBtn');
  btn.disabled = true; btn.textContent = '보내는 중…';
  const payload = {
    overallRating: ratings.overall,
    staffRating: ratings.staff || null,
    resultRating: ratings.result || null,
    revisit: document.querySelector('input[name="revisit"]:checked')?.value || '',
    improvement: $('#improvement').value.trim(),
    comment: $('#comment').value.trim(),
  };
  try {
    const res = await fetch('/api/review' + branchParam, { method:'POST', headers:{ 'Content-Type':'application/json' }, body: JSON.stringify(payload) });
    if (res.status === 429) throw new Error('rate');
    const data = await res.json().catch(() => ({}));
    if (!data.success) throw new Error('server');
    sent = true; dirty = false;
    $('#formSection').hidden = true; $('#actionbar').hidden = true;
    $('#done').classList.add('show');
    window.scrollTo({ top: 0 });
  } catch (e) {
    btn.disabled = false; btn.textContent = '리뷰 보내기';
    alert(e.message === 'rate' ? '잠시 후 다시 시도해주세요.' : '오류가 발생했습니다. 다시 시도해주세요.');
  }
});
window.addEventListener('beforeunload', e => { if (dirty && !sent) { e.preventDefault(); e.returnValue = ''; } });
</script>
</body>
</html>
