<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SCALPIT · Select Your Language</title>
<meta name="description" content="Complimentary Korean head spa experience for international creators.">
<meta property="og:title" content="SCALPIT · Free Korean Head Spa">
<meta property="og:description" content="Complimentary head spa for creators visiting Korea.">
<meta property="og:type" content="website">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Montserrat:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #7B1A2B;
    color: #FAF4EE;
    font-family: 'Montserrat', 'Noto Sans KR', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .select-page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 48px 24px;
    background: linear-gradient(180deg, #7B1A2B 0%, #5A1020 100%);
    position: relative;
  }
  .select-page::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(196,164,124,0.10) 0%, transparent 60%);
    pointer-events: none;
  }
  .select-wrap {
    width: 100%;
    max-width: 560px;
    text-align: center;
    position: relative;
    z-index: 1;
  }
  .select-logo {
    width: 220px;
    max-width: 60vw;
    display: block;
    margin: 0 auto 8px;
    filter: brightness(0) invert(1);
    opacity: 0.98;
  }
  .select-divider {
    width: 48px;
    height: 1px;
    background: rgba(250,244,238,0.35);
    border: none;
    margin: 20px auto 20px;
  }
  .select-tag {
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    letter-spacing: 8px;
    color: rgba(250,244,238,0.75);
    text-transform: uppercase;
    margin-bottom: 72px;
  }
  .select-label {
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 5px;
    color: #D4B896;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .lang-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .lang-card {
    padding: 32px 20px;
    border: 1px solid rgba(250,244,238,0.18);
    border-radius: 4px;
    text-align: center;
    text-decoration: none;
    color: #FAF4EE;
    background: rgba(0,0,0,0.20);
    transition: all 0.25s ease;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .lang-card:hover {
    border-color: #C4A47C;
    background: rgba(196,164,124,0.10);
    transform: translateY(-2px);
  }
  .lang-code {
    font-family: 'Montserrat', sans-serif;
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #C4A47C;
  }
  .lang-name {
    font-size: 15px;
    color: #FAF4EE;
    letter-spacing: 0.5px;
  }
  .lang-card.ja .lang-name { font-family: 'Noto Sans JP', sans-serif; }
  .lang-card.zh .lang-name { font-family: 'Noto Sans TC', sans-serif; }
  .lang-card.ko .lang-name { font-family: 'Noto Sans KR', sans-serif; }
  .select-foot {
    margin-top: 56px;
    font-size: 10px;
    letter-spacing: 3px;
    color: rgba(250,244,238,0.35);
    text-transform: uppercase;
  }
  @media (max-width: 480px) {
    .select-logo { width: 170px; }
    .select-tag { font-size: 11px; letter-spacing: 6px; margin-bottom: 56px; }
    .select-label { font-size: 10px; margin-bottom: 24px; }
    .lang-card { padding: 26px 16px; }
    .lang-code { font-size: 13px; }
    .lang-name { font-size: 14px; }
  }
</style>
</head>
<body class="select-page">
  <div class="select-wrap">
    <img class="select-logo" src="/scalpit-logo.png" alt="SCALPIT">
    <hr class="select-divider">
    <div class="select-tag">HEAD SPA &nbsp;&amp;&nbsp; SCALP CARE</div>
    <div class="select-label">Select Your Language</div>
    <div class="lang-grid">
      <a class="lang-card ko" href="/apply/ko">
        <div class="lang-code">KO</div>
        <div class="lang-name">한국어</div>
      </a>
      <a class="lang-card en" href="/apply/en">
        <div class="lang-code">EN</div>
        <div class="lang-name">English</div>
      </a>
      <a class="lang-card zh" href="/apply/zh">
        <div class="lang-code">ZH</div>
        <div class="lang-name">繁體中文</div>
      </a>
      <a class="lang-card ja" href="/apply/ja">
        <div class="lang-code">JA</div>
        <div class="lang-name">日本語</div>
      </a>
    </div>
    <div class="select-foot">Apgujeong · Gwanggyo · Dongtan · Cheonan</div>
  </div>
</body>
</html>
